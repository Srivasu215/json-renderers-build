<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V3 Table Spec Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
</head>

<body class="bg-light">
  <main class="container py-4">

    <div id="dom-render-container">
    </div>
  </main>

  <script type="module">
    import "../../docs/dist/v15/min.js";

    // import "../../src/index.js";

    import "https://keshavsoft.github.io/json-to-tag/dist/v9/min.js";

    import data from "./batches.json" with {type: "json"};

    const container = document.getElementById("dom-render-container");

    const start = async () => {
      try {
        const spec = window.ks.jsonRenderersBuild.renderToDom({
          type: "table",
          columns: [{ columnName: "itemName" }, { columnName: "baseUnit" }],
          data,
          options: {
            showSerial: true,
            showOptions: [{ label: "show", type: "button" }],
            showFooter: true,
            showFooterSave: true
          }
        });
        console.log("spec : ", spec);
        const control = window.ks.jsonToTag.buildSpecElement(spec);
        console.log("control : ", control);

        const kid = document.getElementById("dom-render-container");

        kid.appendChild(control);
      } catch (err) {
        console.error("Render error:", err);
        container.innerHTML = `<div class="alert alert-danger font-monospace small mb-0">${err.message}</div>`;
      }
    };

    // console.log("k1 : ", renderRequests);

    start();
  </script>
</body>

</html>
