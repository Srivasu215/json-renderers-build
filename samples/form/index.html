<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertical Form Sample - json-renderers-build</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <main class="container py-4">
    <header class="mb-4">
      <h1 class="h3 mb-1">Column-driven Bootstrap form</h1>
      <p class="text-muted mb-0">JSON spec compiled by <code>json-renderers-build</code>, then mounted by <code>json-to-tag</code>.</p>
    </header>

    <div class="row g-4">
      <section class="col-lg-5" aria-labelledby="form-heading">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 id="form-heading" class="h5 mb-3">Contact details</h2>
            <div id="form-container" class="text-muted">Building the form…</div>
          </div>
        </div>
        <div id="submit-result" class="alert alert-success mt-3 d-none" role="status"></div>
      </section>

      <section class="col-lg-7" aria-labelledby="spec-heading">
        <div class="card shadow-sm">
          <div class="card-header bg-white"><h2 id="spec-heading" class="h6 mb-0">Generated JSON-to-DOM spec</h2></div>
          <pre id="spec-output" class="card-body small mb-0 overflow-auto" style="max-height: 34rem"></pre>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./index.js"></script>
</body>

</html>
